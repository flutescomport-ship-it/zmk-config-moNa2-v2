parse_config:
  zmk_keycode_map:
    # JIS配列での実測結果
    LEFT_BRACKET: "@"
    RIGHT_BRACKET: "["
    BACKSLASH: "]"
    PLUS: "~"
    ASTERISK: "("
    EQUAL: "^"
    AT_SIGN: '"'
    LEFT_BRACE: "`"
    RIGHT_BRACE: "{"
    DOUBLE_QUOTES: "*"

    CARET: "$"
    PIPE: "}"
    UNDERSCORE: "="
    SQT: ":"
    COLON: "+"
    AMPERSAND: "'"
    LEFT_PARENTHESIS: ")"

    # 日本語配列固有のキー
    INT1: "\\"
    INT3: "\\"

    # 単独では文字が入力されなかったキー
    GRAVE: "—"
    NON_US_BACKSLASH: "—"
    TILDE: "—"
    RIGHT_PARENTHESIS: "—"
