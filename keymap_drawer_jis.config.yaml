parse_config:
  zmk_keycode_map:
    # JIS配列での実測結果
    LEFT_BRACKET:
      tap: "@"
      shifted: "{"
      type: sym_by_sym
    RIGHT_BRACKET:
      tap: "["
      shifted: "`"
      type: sym_by_sym
    BACKSLASH: "]"
    PLUS: "~"
    ASTERISK: "("
    EQUAL:
      tap: "^"
      shifted: "~"
      type: "sym_by_sym"
    AT_SIGN: '"'
    LEFT_BRACE: "`"
    RIGHT_BRACE: "{"
    DOUBLE_QUOTES: "*"
    MINUS:
      tap: "-"
      shifted: "="
      type: sym_by_sym
    SLASH:
      tap: "/"
      shifted: "?"
      type: sym_by_sym
    COMMA:
      tap: ","
      shifted: "<"
      type: sym_by_sym
    PERIOD:
      tap: "."
      shifted: ">"
      type: sym_by_sym

    CARET: "$"
    PIPE: "}"
    UNDERSCORE: "="
    SQT:
      tap: ":"
      shifted: "*"
      type: sym_by_sym
    COLON: "+"
    SEMICOLON:
      tap: ";"
      shifted: "+"
      type: sym_by_sym
    AMPERSAND: "'"
    LEFT_PARENTHESIS: ")"
    
    NUMBER_1:
      tap: "1"
      shifted: "!"
      type: sym_by_sym

    NUMBER_2:
      tap: "2"
      shifted: '"'
      type: sym_by_sym

    NUMBER_3:
      tap: "3"
      shifted: "#"
      type: sym_by_sym

    NUMBER_4:
      tap: "4"
      shifted: "$"
      type: sym_by_sym

    NUMBER_5:
      tap: "5"
      shifted: "%"
      type: sym_by_sym
      
    NUMBER_6:
      tap: "6"
      shifted: "&"
      type: sym_by_sym
      
    NUMBER_7:
      tap: "7"
      shifted: "'"
      type: sym_by_sym

    NUMBER_8:
      tap: "8"
      shifted: "("
      type: sym_by_sym

    NUMBER_9:
      tap: "9"
      shifted: ")"
      type: sym_by_sym

    # 日本語配列固有のキー
    INT1:
      tap: "\\"
      shifted: "_"
      type: sym_by_sym
    INT3:
      tap: "\\"
      shifted: "|"
      type: sym_by_sym

    # 単独では文字が入力されなかったキー
    GRAVE: "—"
    NON_US_BACKSLASH: "—"
    TILDE: "—"
    RIGHT_PARENTHESIS: "—"
