
parse_config:
  zmk_keycode_map:
    # 以前に確認した記号
    LEFT_BRACKET: "@"
    RIGHT_BRACKET: "["
    PLUS: "~"
    ASTERISK: "("
    EQUAL: "^"
    AT_SIGN: '"'
    LEFT_BRACE: "`"
    RIGHT_BRACE: "{"
    DOUBLE_QUOTES: "*"

    # 今回確認した記号
    CARET: "$"
    PIPE: "}"
    UNDERSCORE: "="
    SQT: ":"
    COLON: "+"

    # Windows 11で何も入力されなかったキー
    GRAVE: "—"
    NON_US_BACKSLASH: "—"
    TILDE: "—"
